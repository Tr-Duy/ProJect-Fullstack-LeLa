name: Frontend CI (LeLa_FE)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'LeLa_FE/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'LeLa_FE/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LeLa_FE/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: LeLa_FE

      - name: Typecheck
        run: npm run typecheck
        working-directory: LeLa_FE

      - name: Build Frontend
        run: npm run build
        working-directory: LeLa_FE
        env:
          VITE_API_URL: https://api.placeholder.com/api/v1
          VITE_GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
