# Cau hinh moi truong prod
spring:
  datasource:
    url: ${YOEDU_DB_URL}
    username: ${YOEDU_DB_USER}
    password: ${YOEDU_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  frontend-url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}

sepay:
  api-key: ${SEPAY_API_KEY}

