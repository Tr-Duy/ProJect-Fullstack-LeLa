spring:
  application:
    name: LeLa
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
  profiles:
    active: ${APP_PROFILE:dev}
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha

app:
  jwt:
    issuer: yoedu-demo
    secret: ${YOEDU_JWT_SECRET}
    access-token-ttl-minutes: 480
    refresh-token-ttl-days: 7
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

sepay:
  api-key: ${SEPAY_API_KEY:}

payment:
  bank:
    code: ${PAYMENT_BANK_CODE:MB}
    account-number: ${PAYMENT_BANK_ACCOUNT_NUMBER:0339999999}
    account-name: ${PAYMENT_BANK_ACCOUNT_NAME:CONG TY LELA}

gemini:
  api-key: ${GEMINI_API_KEY}
  primary-model: ${GEMINI_PRIMARY_MODEL:gemini-3.5-flash}
  fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-flash-lite-latest}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}

typing-game:
  stale-timeout-minutes: 30
  cleanup-cron: "0 */15 * * * *"
  daily-xp-cap: 150

