spring:
  application:
    name: LeLa
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID_HERE}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET_HERE}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
  profiles:
    active: ${APP_PROFILE:dev}
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  sql:
    init:
      mode: never

server:
  port: 8080
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha

app:
  jwt:
    issuer: yoedu-demo
    secret: ${YOEDU_JWT_SECRET:yoedu-demo-secret-key-12345678901234567890}
    access-token-ttl-minutes: 480
    refresh-token-ttl-days: 7

gemini:
  api-key: ${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
  api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:streamGenerateContent
