spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lela_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    secret: ${YOEDU_JWT_SECRET:yoedu-demo-secret-key-12345678901234567890-32bytes-secure-dev-key}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


sepay:
  api-key: ${SEPAY_API_KEY:dev-sepay-key}

payment:
  bank:
    code: ${PAYMENT_BANK_CODE:MB}
    account-number: ${PAYMENT_BANK_ACCOUNT_NUMBER:0339999999}
    account-name: ${PAYMENT_BANK_ACCOUNT_NAME:CONG TY LELA}

gemini:
  api-key: ${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
  primary-model: ${GEMINI_PRIMARY_MODEL:gemini-3.5-flash}
  fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-flash-lite-latest}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
