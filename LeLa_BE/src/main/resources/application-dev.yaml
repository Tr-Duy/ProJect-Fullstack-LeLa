spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lela_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    secret: ${YOEDU_JWT_SECRET:yoedu-demo-secret-key-12345678901234567890-32bytes-secure-dev-key}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


sepay:
  api-key: ${SEPAY_API_KEY:dev-sepay-key}

gemini:
  api-key: ${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
